[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdif"
version = "1.0.0"
description = "Metadata-Driven Ingestion Framework — ADF-style pipelines in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahul Ega" }]
dependencies = [
  "pyyaml==6.0.2",
  "jsonschema==4.23.0",
  "duckdb==1.1.3",
  "pyarrow==18.1.0",
  "pandas==2.2.3",
  "requests==2.32.3",
  "jinja2==3.1.4",
  "click==8.1.7",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[project.scripts]
mdif = "mdif.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
